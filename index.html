<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfeaea">
<title>S.A.R.C 표면적 & 보충량 계산기</title>
<link rel="manifest" href="./manifest.webmanifest?v=143">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" sizes="192x192" type="image/png" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="S.A.R.C">
<style>
:root{
  --bg:#e8efee;
  --surface:#f7faf9;
  --card:#ffffff;
  --line:#d7e2df;
  --line-strong:#c3d3cf;
  --text:#16363b;
  --muted:#6d8587;
  --accent:#0a8f8a;
  --accent-deep:#056c67;
  --accent-soft:#eff8f6;
  --danger:#d94d6a;
  --shadow:0 6px 18px rgba(22,54,59,.05);
  --radius:18px;
  --radius-sm:12px;
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none !important}
.app{max-width:480px;margin:0 auto;padding:0 10px 24px}
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(223,234,234,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(10,143,138,.08);
}
.topbar-inner{max-width:480px;margin:0 auto;padding:10px 10px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:58px;height:58px;border-radius:16px;display:block;overflow:hidden;flex:0 0 58px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.logo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:16px}
.brand-copy{min-width:0}
.brand-copy h1{margin:0;font-size:28px;line-height:1;font-weight:900;letter-spacing:.02em}
.brand-copy p{margin:5px 0 0;font-size:11px;letter-spacing:.16em;color:#587174;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.header-state{margin-left:auto;text-align:right;white-space:nowrap;flex:0 0 auto}
.header-state .live{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-weight:900;font-size:12px}
.header-state .dot{width:11px;height:11px;border-radius:50%;background:#2cc77e;box-shadow:0 0 0 5px rgba(44,199,126,.12)}
.header-state .version{margin-top:5px;font-size:11px;font-weight:800;color:#5b7577}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 10px 10px;max-width:480px;margin:0 auto}
.tab-btn{border:1px solid var(--line-strong);background:#edf4f3;color:#4c6769;border-radius:18px;padding:11px 8px;font-weight:900;font-size:15px;box-shadow:none}
.tab-btn.active{background:#fff;color:var(--accent-deep);box-shadow:var(--shadow)}
.page{padding-top:10px}
.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title-row h2{margin:0;font-size:18px;line-height:1.1;font-weight:900}
.inline-jd{display:flex;align-items:center;overflow:hidden;border:1px solid var(--line-strong);border-radius:12px;background:#fff;min-height:40px}
.inline-jd label{display:flex;align-items:center;font-size:11px;font-weight:900;color:#556f71;padding:0 8px;height:40px;border-right:1px solid var(--line)}
.inline-jd input{width:54px;border:0;outline:0;text-align:center;font-size:20px;font-weight:900;color:#2d5458;background:transparent}
.inline-jd span{padding:0 8px;font-size:11px;font-weight:800;color:#73888a;border-left:1px solid var(--line);height:40px;display:flex;align-items:center}
.unit-chip{align-self:flex-start;border:1px solid #bfd8d4;background:#edf8f6;color:var(--accent-deep);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900}
.helper{margin:-2px 0 10px;font-size:11px;color:#809597;font-weight:700}
.shape-selector{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.check-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:#fff;border-radius:999px;padding:8px 12px;font-weight:900;color:#456063;box-shadow:var(--shadow);font-size:12px}
.check-pill input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px 12px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head small{display:block;font-size:11px;color:var(--accent);font-weight:900;letter-spacing:.12em}
.card-head h3{margin:4px 0 0;font-size:18px;line-height:1.15}
.formula{display:inline-flex;align-items:center;padding:8px 12px;border-radius:999px;background:#f5f8f7;border:1px solid var(--line-strong);font-size:12px;font-weight:900;color:#5f7677;margin-left:10px}
.head-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:#f8fbfb;color:#7f9798;font-size:22px;line-height:1;font-weight:900}
.icon-btn.primary{color:var(--accent-deep)}
.item-box{border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;background:#fbfdfd;margin-top:10px}
.item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.item-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:900;color:#1a8080}
.item-title .preset{display:inline-flex;align-items:center;gap:6px;border:1px solid #cbd9d6;background:#f4f7f7;border-radius:999px;padding:6px 10px;color:#4a6466;font-size:12px;font-weight:800}
.grid{display:grid;gap:10px}
.grid.cyl{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.circle{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.box{grid-template-columns:repeat(4,minmax(0,1fr))}
.field label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:#4b6264;margin-bottom:6px}
.field small{font-size:11px;color:#8ca0a2}
.field input{width:100%;height:44px;border:1px solid var(--line-strong);border-radius:14px;background:#fff;padding:0 12px;font-size:16px;font-weight:900;color:#1d3f43;outline:none}
.field input::placeholder{color:#b4c2c4}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(10,143,138,.10)}
.item-result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.mini-result{border-top:1px solid #edf3f2;padding-top:8px;font-size:12px;color:#698082;font-weight:900}
.mini-result b{display:block;font-size:14px;color:var(--accent-deep);margin-top:4px}
.card-total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid #e8efee}
.card-total .copy small{display:block;font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:900}
.card-total .copy b{display:block;font-size:13px;color:#5d7476;margin-top:4px}
.value-big{font-size:18px;font-weight:900;color:var(--accent-deep);text-align:right}
.value-big small{font-size:12px;color:#7a9193;font-weight:800}
.summary-card{background:linear-gradient(180deg,#ffffff,#f8fbfb);border:1px solid #cddcda;border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-top:18px}
.summary-card h3{margin:0 0 12px;font-size:18px}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.summary-box{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;text-align:center}
.summary-box small{display:block;color:#708688;font-size:12px;font-weight:900}
.summary-box b{display:block;margin-top:8px;font-size:22px;color:var(--accent-deep)}
.summary-box span{font-size:12px;color:#708688;font-weight:800}
.action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.soft-btn,.primary-btn{height:46px;padding:0 18px;border-radius:14px;font-weight:900;border:1px solid var(--line-strong)}
.soft-btn{background:#fff;color:#39585b}
.primary-btn{background:linear-gradient(180deg,#0d8f89,#076b67);color:#fff;border-color:#076b67}
.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h3{margin:0 0 12px;font-size:20px}
.panel .sub{font-size:12px;color:#7e9496;font-weight:700;margin-top:-6px;margin-bottom:12px}
.row-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.row-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.note{margin-top:10px;font-size:12px;color:#728789;font-weight:700}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.preset-row{display:grid;grid-template-columns:1fr 120px 80px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fbfdfd}
.preset-row .name{font-weight:900;color:#294c50}
.preset-row .meta{font-weight:800;color:#647a7c;font-size:13px}
.empty{padding:14px;border:1px dashed var(--line-strong);border-radius:14px;text-align:center;color:#7f9496;font-size:13px;font-weight:800;background:#fbfdfd}
@media (max-width:760px){
  .summary-grid,.row-4{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .topbar-inner{align-items:center;gap:10px}
  .brand{gap:10px;min-width:0;flex:1}
  .brand-copy h1{font-size:24px}
  .brand-copy p{font-size:10px;max-width:180px}
  .header-state .live{font-size:11px}
  .header-state .version{font-size:10px}
  .section-head{flex-direction:column}
  .grid.cyl,.grid.box,.grid.circle,.row-3,.row-2,.preset-row,.item-result{grid-template-columns:1fr}
  .tabs{grid-template-columns:1fr 1fr 1fr}
  .tab-btn{font-size:14px;padding:10px 6px}
  .title-row h2{font-size:16px}
  .summary-grid{grid-template-columns:1fr}
}

/* V1.0.33: restore preserved preset and replenishment controls without redesigning mobile UI */
.preset-choices{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.preset-check{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid #cbdfdb;padding:5px 8px;font-size:10px;font-weight:800;background:#f7fbfa;color:#386365;cursor:pointer;max-width:100%}
.preset-check input{margin:0;width:13px;height:13px;accent-color:var(--accent)}
.preset-check.selected{border-color:var(--accent);background:#e9f8f5}
.density-choices{margin:4px 0 8px;display:flex;flex-wrap:wrap;gap:5px}
.preset-editor{border:1px solid var(--line);border-radius:14px;padding:10px;background:#f9fcfb}
.preset-items{display:grid;gap:7px;margin-top:10px}
.saved-preset{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff}
.saved-preset .saved-name{flex:1;min-width:110px;font-weight:800;font-size:12px;color:#315356}
.saved-preset .saved-dims{color:#748b8b;font-size:11px}
.small-btn{border:1px solid #d2e1dd;border-radius:9px;padding:7px 9px;background:#f7fbfa;color:#316161;font-size:12px;font-weight:800;white-space:nowrap}
.small-btn.danger{color:#b85063;background:#fff8f8}
.settings-caption{font-size:11px;color:#678184;margin:6px 0 8px}
.settings-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.field select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line-strong);padding:0 8px;background:#fff;color:var(--text);font-weight:800;font-size:13px}
.shape-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:9px 0}
.inline-switch{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;color:#426367}
.inline-switch input{accent-color:var(--accent)}
.result-note{padding:8px;background:#f0f9f7;border-radius:10px;font-size:12px;color:#426a6a;line-height:1.5}
.repl-out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.repl-metric{padding:10px;border-radius:13px;background:#f5faf9;border:1px solid var(--line)}
.repl-metric span{font-size:11px;color:#648184;display:block;font-weight:800}
.repl-metric b{display:block;font-size:15px;color:var(--accent-deep);margin-top:5px;overflow-wrap:anywhere}
.repl-control{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}
.repl-error{color:#af4358;background:#fff3f5;border:1px solid #f5d3d8}
@media(max-width:640px){
  .grid.cyl{grid-template-columns:repeat(3,minmax(0,1fr))}
  .grid.circle{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid.box{grid-template-columns:repeat(2,minmax(0,1fr))}
  .item-result{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini-result{font-size:9px;overflow-wrap:anywhere}
  .mini-result b{font-size:11px}
  .row-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .field label{font-size:10px}
  .field input{min-width:0;padding:0 8px}
  .shape-inputs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .check-pill{font-size:11px}
}
@media(max-width:350px){.grid.cyl,.grid.box,.item-result{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* V1.0.34 — compact S.A.R.C mobile typography. Existing functional code untouched. */
.app{max-width:480px;padding:0 10px calc(22px + env(safe-area-inset-bottom))}
.topbar-inner{padding:6px 10px 5px;gap:8px;min-height:56px}

/* V1.0.36 — compact mobile header, sticky control zone, per-card current summary */
:root{--topbar-h:96px}
.surface-sticky{position:sticky;top:var(--topbar-h);z-index:35;margin:0 -10px 10px;padding:8px 10px 10px;background:rgba(232,239,238,.98);backdrop-filter:blur(10px);border-bottom:1px solid rgba(10,143,138,.14)}
.surface-head{align-items:flex-start;gap:8px;margin-bottom:6px}
.surface-head-left{min-width:0;flex:1}
.surface-summary-inline{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto;min-width:0}
.summary-inline-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.summary-inline-box{min-width:66px;padding:6px 7px;border:1px solid var(--line-strong);border-radius:12px;background:#fff;text-align:center}
.summary-inline-box small{display:block;font-size:8px;color:#708688;font-weight:900;line-height:1.2}
.summary-inline-box b{display:block;margin-top:4px;font-size:14px;line-height:1.05;color:var(--accent-deep);overflow-wrap:anywhere}
.summary-inline-box span{font-size:8px;color:#708688;font-weight:800}
.soft-btn.compact{height:34px;padding:0 10px;font-size:11px}
.surface-control-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
.shape-selector.compact{margin:0;flex:1 1 200px}
.surface-side-controls{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.surface-side-controls .inline-jd{min-height:34px;border-radius:10px}
.surface-side-controls .inline-jd label{height:34px;font-size:9px;padding:0 6px}
.surface-side-controls .inline-jd input{width:42px;font-size:15px}
.surface-side-controls .inline-jd span{height:34px;font-size:9px;padding:0 6px}
.surface-side-controls .unit-chip{align-self:center;margin:0}
.surface-density-presets{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0}
.surface-density-presets .preset-check{background:#fff}
.card-total{align-items:stretch}
.card-total-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;flex:1;max-width:240px;min-width:170px}
.total-mini{padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fbfdfd;text-align:right}
.total-mini span{display:block;font-size:9px;color:#6d8587;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.total-mini b{display:block;margin-top:4px;font-size:17px;line-height:1.05;color:var(--accent-deep);overflow-wrap:anywhere}
.total-mini small{font-size:9px;color:#7a9193;font-weight:800}
.summary-card{display:none !important}
@media(max-width:640px){
  .surface-sticky{padding-top:6px;padding-bottom:8px}
  .surface-head{flex-direction:column;align-items:stretch}
  .surface-summary-inline{align-items:stretch}
  .summary-inline-grid{width:100%;grid-template-columns:repeat(4,minmax(0,1fr))}
  .soft-btn.compact{width:100%}
  .surface-control-row{align-items:flex-start}
  .shape-selector.compact{flex:1 1 100%}
  .surface-side-controls{width:100%;justify-content:space-between;margin-left:0}
  .surface-density-presets{margin-top:5px}
  .card-total{flex-direction:column;align-items:stretch}
  .card-total-values{max-width:none;width:100%}
}
@media(max-width:420px){
  .summary-inline-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .summary-inline-box{min-width:0;padding:6px 3px}
  .summary-inline-box small{font-size:7px;line-height:1.25;overflow-wrap:anywhere}
  .summary-inline-box b{font-size:13px}
  .soft-btn.compact{font-size:10px;padding:0 3px}
  .surface-side-controls{gap:5px}
  .surface-side-controls .unit-chip{font-size:9px;padding:6px 8px}
}


/* V1.0.38 — shape checks match replenishment controls; white sticky surface summary card */
.surface-controls-card{
  position:sticky;
  top:var(--topbar-h);
  z-index:35;
  margin:0 0 10px;
  padding:10px 12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 5px 16px rgba(22,54,59,.055);
  backdrop-filter:none;
}
.surface-controls-card .summary-inline-box{background:#f8fbfa}
.surface-controls-card .shape-selector.compact{
  display:flex;align-items:center;gap:12px;flex:1 1 auto;min-width:0;
}
.surface-controls-card .shape-switch{
  padding:0;margin:0;min-height:30px;
  border:0;border-radius:0;background:transparent;box-shadow:none;
  font-size:11px;font-weight:800;color:#426367;white-space:nowrap;
  display:inline-flex;gap:4px;align-items:center;
}
.surface-controls-card .shape-switch input{width:13px;height:13px;margin:0;accent-color:var(--accent)}
.surface-controls-card .surface-control-row{align-items:center;gap:8px;flex-wrap:nowrap}
.surface-controls-card .surface-side-controls{margin-left:auto;flex:0 0 auto;width:auto;justify-content:flex-end}
.surface-controls-card .surface-density-presets{margin-top:5px}
@media(max-width:640px){
 .surface-controls-card{margin-bottom:10px;padding:8px 10px}
 .surface-controls-card .shape-selector.compact{flex:1 1 auto;gap:9px}
 .surface-controls-card .shape-switch{font-size:10px;min-height:28px}
 .surface-controls-card .surface-control-row{flex-wrap:wrap;justify-content:space-between}
 .surface-controls-card .surface-side-controls{width:auto;margin-left:auto}
}
@media(max-width:350px){
 .surface-controls-card .shape-selector.compact{gap:6px}
 .surface-controls-card .shape-switch{font-size:9.5px}
 .surface-controls-card .surface-side-controls .inline-jd label{font-size:8px;padding:0 4px}
 .surface-controls-card .surface-side-controls .inline-jd input{width:35px}
 .surface-controls-card .surface-side-controls .inline-jd span{font-size:8px;padding:0 4px}
}

/* V1.0.38: unified white top-level panel across all three menus. */
#page-surface > .surface-sticky.panel,
#page-replenishment > .panel,
#page-settings > .panel {
  padding:12px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 4px 13px rgba(25,60,60,.04);
}
#page-surface > .surface-sticky.panel {
  position:sticky;
  top:var(--topbar-h);
  z-index:35;
  margin:0 0 10px;
  backdrop-filter:none;
}
#page-surface > .surface-sticky.panel .title-row h2,
#page-replenishment > .panel > h3,
#page-settings > .panel > h3 {
  font-size:16px;
  line-height:1.25;
  font-weight:900;
}
#page-surface > .surface-sticky.panel .helper {
  font-size:10px;
  color:#7e9496;
}
#page-settings .settings-section {
  margin-top:12px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
#page-surface > #surfaceCards > .card {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:0 4px 13px rgba(25,60,60,.04);
}


/* V1.0.39 — Unfrozen unified surface calculator panel. */
#page-surface {
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px;
  margin-top:7px;
  box-shadow:0 4px 13px rgba(25,60,60,.04);
}
#page-surface > .surface-sticky.panel {
  position:static;
  top:auto;
  z-index:auto;
  padding:0;
  margin:0;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  backdrop-filter:none;
}
#page-surface .surface-head {align-items:center;gap:8px;margin-bottom:10px;}
#page-surface .surface-head-left {flex:0 0 auto;}
#page-surface .title-row h2 {white-space:nowrap;word-break:keep-all;font-size:16px;}
#page-surface .surface-summary-inline {min-width:0;flex:1;align-items:stretch;}
#page-surface .summary-inline-grid {width:100%;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;}
#page-surface .summary-inline-box {min-width:0;min-height:44px;padding:5px 3px;border-radius:10px;}
#page-surface .summary-inline-box small {font-size:7.3px;line-height:1.22;overflow-wrap:anywhere;}
#page-surface .summary-inline-box b {font-size:14px;line-height:1.1;margin-top:3px;}
#page-surface #resetSurfaceBtn {
  width:auto;min-width:0;height:44px;padding:0 2px;
  font-size:10px;border-radius:10px;white-space:nowrap;
}
#page-surface .surface-control-row {display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:space-between;}
#page-surface .shape-selector.compact {margin:0;flex:0 1 auto;gap:11px;}
#page-surface .shape-selector .inline-switch {font-size:10px;font-weight:800;gap:5px;white-space:nowrap;}
/* Radio appearance, independent multi-check behavior retained. */
#page-surface .shape-selector .inline-switch input[type="checkbox"] {
  -webkit-appearance:none;appearance:none;box-sizing:border-box;
  width:14px;height:14px;flex:0 0 14px;margin:0;
  border:1px solid #789b9a;border-radius:50%;background:#fff;
  display:grid;place-content:center;cursor:pointer;
}
#page-surface .shape-selector .inline-switch input[type="checkbox"]::before {
  content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);
  transform:scale(0);transition:transform .08s ease;
}
#page-surface .shape-selector .inline-switch input[type="checkbox"]:checked {border-color:var(--accent);}
#page-surface .shape-selector .inline-switch input[type="checkbox"]:checked::before {transform:scale(1);}
#page-surface .shape-selector .inline-switch input[type="checkbox"]:focus-visible {outline:2px solid #4aaba5;outline-offset:2px;}
#page-surface .surface-side-controls {margin-left:auto;flex:0 0 auto;}
#page-surface .surface-density-presets {margin:6px 0 0;}
#page-surface #surfaceCards {margin-top:10px;border-top:1px solid var(--line);}
#page-surface #surfaceCards:empty {display:none;}
#page-surface > #surfaceCards > .card {
  border:0;border-top:1px solid var(--line);border-radius:0;
  padding:14px 0 12px;margin:0;background:transparent;
  box-shadow:none;
}
#page-surface > #surfaceCards > .card:first-child {border-top:0;}
#page-surface > #surfaceCards > .card:last-child {padding-bottom:0;}
@media(max-width:640px) {
  #page-surface .surface-head {display:flex;flex-direction:row;align-items:center;gap:8px;}
  #page-surface .surface-head-left {flex:0 0 auto;min-width:0;}
  #page-surface .surface-summary-inline {flex:1 1 0;min-width:0;}
  #page-surface .surface-control-row {flex-wrap:wrap;}
  #page-surface .shape-selector.compact {flex:0 1 auto;gap:10px;}
  #page-surface .surface-side-controls {width:auto;margin-left:auto;}
}
@media(max-width:389px) {
  #page-surface .surface-head {flex-direction:column;align-items:stretch;}
  #page-surface .surface-summary-inline {width:100%;}
  #page-surface .summary-inline-box small {font-size:8px;}
  #page-surface .shape-selector.compact {gap:8px;}
  #page-surface .surface-side-controls {margin-left:auto;}
}


/* V1.0.40 — consistent header title and compact left-aligned control row */
#page-surface > .surface-controls-card .surface-head,
#page-surface > .surface-sticky.panel .surface-head {
  display:block;
  margin:0 0 9px;
}
#page-surface .surface-head-left {width:100%;display:block;min-width:0;}
#page-surface .surface-head .title-row {display:block;}
#page-surface .surface-head h2 {
  display:block;
  font-size:16px;
  line-height:1.25;
  white-space:nowrap;
  margin:0;
  font-weight:900;
}
#page-surface .surface-toolbar {
  display:grid;
  grid-template-columns:1.02fr 1.05fr .9fr 1.75fr .72fr;
  gap:4px;
  align-items:stretch;
  width:100%;
  margin:0;
}
#page-surface .surface-toolbar > .summary-inline-box,
#page-surface .surface-toolbar > .surface-inline-density,
#page-surface .surface-toolbar > #resetSurfaceBtn {
  height:40px;
  min-height:40px;
  width:100%;
  min-width:0;
  box-sizing:border-box;
  margin:0;
  border-radius:9px;
}
#page-surface .surface-toolbar > .summary-inline-box {
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:1px 2px;
  text-align:center;
}
#page-surface .surface-toolbar .summary-inline-box small {
  font-size:7px;
  letter-spacing:-.25px;
  line-height:1.12;
  font-weight:900;
  overflow-wrap:normal;
  word-break:keep-all;
}
#page-surface .surface-toolbar .summary-inline-box b {
  font-size:14px;
  line-height:1.05;
  margin-top:3px;
  overflow-wrap:anywhere;
}
#page-surface .surface-toolbar .surface-inline-density {
  display:flex;
  align-items:stretch;
  overflow:hidden;
  background:#fff;
  border:1px solid var(--line-strong);
}
#page-surface .surface-toolbar .surface-inline-density label,
#page-surface .surface-toolbar .surface-inline-density span {
  height:auto;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 3px;
  white-space:nowrap;
  font-size:7.5px;
  line-height:1;
}
#page-surface .surface-toolbar .surface-inline-density input {
  flex:1 1 0;
  width:0;
  min-width:0;
  height:100%;
  padding:0 3px 0 0;
  text-align:right;
  border:0;
  font-size:14px;
  font-weight:900;
  outline-offset:-2px;
  background:#fff;
  font-variant-numeric:tabular-nums;
}
#page-surface .surface-toolbar > #resetSurfaceBtn {
  padding:0 2px;
  font-size:9px;
  border:1px solid var(--line-strong);
  white-space:nowrap;
  text-align:center;
  justify-self:stretch;
}
#page-surface .surface-control-row {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:5px 8px;
  margin-top:9px;
}
#page-surface .shape-selector.compact {
  flex:0 0 auto;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin:0;
}
#page-surface .shape-selector .inline-switch {
  display:inline-flex;
  align-items:center;
  justify-content:flex-start;
  vertical-align:middle;
  gap:5px;
  padding:0;
  margin:0;
  min-height:22px;
  line-height:1;
  white-space:nowrap;
  font-size:10px;
  font-weight:800;
}
/* Center radio-style inner dot exactly, while preserving multi-select checkbox behavior. */
#page-surface .shape-selector .inline-switch input[type="checkbox"] {
  -webkit-appearance:none;
  appearance:none;
  display:block;
  width:14px;
  height:14px;
  min-width:14px;
  flex:0 0 14px;
  margin:0;
  padding:0;
  box-sizing:border-box;
  border:1px solid #789b9a;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  vertical-align:middle;
}
#page-surface .shape-selector .inline-switch input[type="checkbox"]::before {content:none;display:none;}
#page-surface .shape-selector .inline-switch input[type="checkbox"]:checked {
  border-color:var(--accent);
  background:radial-gradient(circle at center,var(--accent) 0 3.5px,#fff 3.7px);
}
#page-surface .surface-density-presets {
  display:flex;
  flex:1 1 auto;
  width:auto;
  min-width:0;
  margin:0 0 0 auto;
  padding:0;
  gap:4px;
  flex-wrap:wrap;
  justify-content:flex-end;
  align-items:center;
}
#page-surface .surface-density-presets:empty {display:none;}
#page-surface .surface-density-presets .preset-check {max-width:100%;overflow-wrap:anywhere;}
@media(max-width:380px){
  #page-surface .surface-toolbar {grid-template-columns:repeat(6,minmax(0,1fr));}
  #page-surface .surface-toolbar > .summary-inline-box {grid-column:span 2;}
  #page-surface .surface-toolbar > .surface-inline-density {grid-column:span 4;}
  #page-surface .surface-toolbar > #resetSurfaceBtn {grid-column:span 2;}
}
@media(max-width:350px){
  #page-surface .shape-selector.compact {gap:8px;}
}


/* V1.0.41 — unify muted example text with the existing 12px shape-selector typography.
   Scope to placeholders, preset-save buttons, and preset empty-state messages only.
   Actual field entry values and calculations remain unchanged. */
#page-surface input::placeholder,
#page-replenishment input::placeholder,
#page-settings input::placeholder {
  font-size:12px;
  font-weight:800;
}
#savePresetBtn,
#saveSurfacePresetBtn {
  font-size:12px;
  font-weight:800;
}
.empty {
  font-size:12px;
  font-weight:800;
}


/* V1.0.42: compact fields, adjoining parenthesized units, neutral save controls */
.surface-inline-density label small{font-size:7px;color:#7d9697;margin-left:2px;font-weight:800;}
.field label{justify-content:flex-start;align-items:center;gap:4px;min-height:14px;flex-wrap:wrap;}
.field label small{font-size:9px;font-weight:800;color:#8ca0a2;white-space:nowrap;}
.field label .field-note{font-size:8px;color:#849c9d;margin-left:auto;font-weight:700;}
/* Maintain 16px numeric text on iOS (prevents focusing from zooming the page). */
.field input{height:37px;min-height:37px;font-size:16px;border-radius:10px;padding:0 9px;}
.field select{height:37px;min-height:37px;border-radius:10px;}
#savePresetBtn,#saveSurfacePresetBtn{background:#fff;color:#39585b;border:1px solid var(--line-strong);box-shadow:none;font-size:12px;font-weight:800;}
#savePresetBtn:active,#saveSurfacePresetBtn:active{background:#f2f7f6;}
/* The companion control remains a checkbox, using the same centered round indicator as shape choices. */
.companion-switch{display:inline-flex;align-items:center;gap:6px;line-height:1.3;}
.companion-switch input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:14px;height:14px;min-width:14px;flex:0 0 14px;margin:0;padding:0;border:1px solid #789b9a;border-radius:50%;background:#fff;cursor:pointer;}
.companion-switch input[type="checkbox"]:checked{border-color:var(--accent);background:radial-gradient(circle at center,var(--accent) 0 3.5px,#fff 3.7px);}
.companion-switch input[type="checkbox"]:focus-visible{outline:2px solid #4aaba5;outline-offset:2px;}


/* V1.0.43 — position the area preset save beside the last dimension field. */
#page-settings .area-save-row {
  display:grid;
  grid-template-columns:minmax(0,1fr) max-content;
  align-items:end;
  gap:8px;
  margin:9px 0 0;
}
#page-settings .area-save-row .shape-inputs {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
  margin:0;
  min-width:0;
}
#page-settings .area-save-row[data-shape="circle"] .shape-inputs {
  grid-template-columns:minmax(0,1fr);
}
#page-settings .area-save-row[data-shape="box"] .shape-inputs {
  grid-template-columns:repeat(3,minmax(0,1fr));
}
#page-settings .area-save-row .field {
  min-width:0;
}
#page-settings .area-save-field {
  display:flex;
  flex-direction:column;
  align-items:stretch;
  min-width:0;
}
#page-settings .area-save-field label {
  margin-bottom:5px;
}
#page-settings #saveSurfacePresetBtn {
  height:37px;
  min-height:37px;
  padding:0 9px;
  font-size:11px;
  white-space:nowrap;
  border-radius:10px;
}
#page-settings .area-edit-actions {
  margin-top:8px;
}
#page-settings .area-edit-actions:has(#cancelSurfaceEditBtn.hidden){display:none;}
@media(max-width:360px) {
  /* Three cuboid dimensions: keep Save to the right of the Height field. */
  #page-settings .area-save-row[data-shape="box"] {
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  #page-settings .area-save-row[data-shape="box"] .shape-inputs {
    display:contents;
  }
}

</style>

<body>
<header class="topbar">

<div class="app">
  <section class="page" id="page-surface">
    <div class="surface-sticky panel surface-controls-card" id="surfaceSticky">
      <div class="section-head surface-head">
        <div class="surface-head-left">
          <div class="title-row"><h2>표면적 계산기</h2></div>
        </div>
      </div>
      <div class="summary-inline-grid surface-toolbar">
        <div class="summary-inline-box"><small>총 표면적(dm²)</small><b id="sumArea">0.00</b></div>
        <div class="summary-inline-box"><small>전류 밀도(A/dm²)</small><b id="sumDensity">1.00</b></div>
        <div class="summary-inline-box"><small>총 전류(A)</small><b id="sumCurrent">0.00</b></div>
        <div class="inline-jd surface-inline-density">
          <label for="surfaceCurrentDensity">전류 밀도 <small>(A/dm²)</small></label>
          <input id="surfaceCurrentDensity" type="number" step="any" inputmode="decimal" placeholder="1">
        </div>
        <button class="soft-btn compact" id="resetSurfaceBtn" type="button">초기화</button>
      </div>
      <div class="surface-control-row">
        <div class="shape-selector compact">
          <label class="inline-switch"><input type="checkbox" id="toggleCylinder" checked> 원통</label>
          <label class="inline-switch"><input type="checkbox" id="toggleCircle" checked> 원</label>
          <label class="inline-switch"><input type="checkbox" id="toggleBox" checked> 육면체</label>
        </div>
        <div class="density-choices surface-density-presets" id="densityPresetChoices" aria-label="저장된 전류밀도 선택"></div>
      </div>
    </div>

    <div id="surfaceCards"></div>
  </section>

  <section class="page hidden" id="page-replenishment">
  <div class="panel">
    <h3>보충량 계산</h3>
    <div class="repl-control" aria-label="탱크 용량 입력 방식">
      <label class="inline-switch"><input type="radio" name="tankMode" value="direct" checked> 용량 직접 입력</label>
      <label class="inline-switch"><input type="radio" name="tankMode" value="size"> 치수로 계산</label>
    </div>
    <div class="field" id="volumeDirectBox"><label>탱크 용량 <small>(L)</small></label><input id="tankVolume" type="number" min="0" step="any" placeholder="예: 2400"></div>
    <div class="row-3" id="tankSizeBox" style="margin-top:8px">
      <div class="field"><label>가로 <small>(mm)</small></label><input id="tankWidth" type="number" step="any" placeholder="2000"></div>
      <div class="field"><label>세로 <small>(mm)</small></label><input id="tankDepth" type="number" step="any" placeholder="900"></div>
      <div class="field"><label>액높이 <small>(mm)</small></label><input id="tankHeight" type="number" step="any" placeholder="수위"></div>
    </div>
    <div class="row-2" style="margin-top:12px">
      <div class="field"><label>현재 농도 <small>(g/L)</small></label><input id="currentConc" type="number" step="any" placeholder="현재"></div>
      <div class="field"><label>목표 농도 <small>(g/L)</small></label><input id="targetConc" type="number" step="any" placeholder="목표"></div>
    </div>
    <div class="settings-block" id="additiveOptions">
      <h3 style="font-size:15px">농도 상승 시 보충 약품</h3>
      <div class="repl-control"><label class="inline-switch"><input type="radio" name="chemType" value="solid" checked> 고형 약품</label><label class="inline-switch"><input type="radio" name="chemType" value="liquid"> 액상 약품</label></div>
      <div class="field" id="solidBox"><label>고형 약품 순도 <small>(%)</small><span class="field-note">미입력 시 100%</span></label><input id="solidPurity" type="number" min="0" step="any" placeholder="100"></div>
      <div id="liquidBox" class="hidden">
        <div class="repl-control"><label class="inline-switch"><input type="radio" name="chemInputMode" value="wt" checked> wt% + 비중</label><label class="inline-switch"><input type="radio" name="chemInputMode" value="gpl"> 원액 g/L</label></div>
        <div class="row-2">
          <div class="field" id="stockPctBox"><label>원액 농도 <small>(wt%)</small></label><input id="chemPct" type="number" step="any"></div>
          <div class="field hidden" id="stockGplBox"><label>원액 유효 농도 <small>(g/L)</small></label><input id="stockGpl" type="number" step="any"></div>
          <div class="field"><label>원액 비중 <small>(kg/L)</small></label><input id="chemSG" type="number" step="any" placeholder="1.18"></div>
        </div>
        <div class="repl-control"><label class="inline-switch"><input type="radio" name="volumeMode" value="fixed" checked> 일정 용량(같은 양 배출)</label><label class="inline-switch"><input type="radio" name="volumeMode" value="grow"> 용량 증가</label></div>
        <div class="row-2"><div class="field"><label>액상 입고/투입 단위</label><select id="liquidInputUnit"><option value="L">L</option><option value="kg">kg</option></select></div><div class="field"><label>kg↔L 환산할 양 <small>(L/kg)</small></label><input id="chemInputAmount" type="number" step="any" placeholder="선택 입력"></div></div>
      </div>
    </div>
    <div class="settings-block">
      <label class="inline-switch companion-switch"><input id="companionEnable" type="checkbox"> 동반 약품 농도도 함께 유지</label>
      <div id="companionBox" class="hidden">
        <div class="row-2" style="margin-top:10px">
          <div class="field"><label>동반 약품 현재 농도 <small>(g/L)</small></label><input id="companionCurrent" type="number" step="any"></div>
          <div class="field"><label>동반 약품 목표 농도 <small>(g/L)</small></label><input id="companionTarget" type="number" step="any"></div>
          <div class="field"><label>보충 원액 농도 <small>(wt%)</small></label><input id="companionPct" type="number" step="any"></div>
          <div class="field"><label>보충 원액 비중 <small>(kg/L)</small></label><input id="companionSG" type="number" step="any"></div>
          <div class="field"><label>말통/포장 용량 <small>(L/kg)</small></label><input id="packageSize" type="number" step="any"></div>
          <div class="field"><label>포장 단위</label><select id="packageUnit"><option value="L">L</option><option value="kg">kg</option></select></div>
        </div>
      </div>
    </div>
    <div class="settings-block">
      <div class="repl-out" id="replResultGrid">
        <div class="repl-metric"><span>탱크 용량</span><b id="volumeResult">—</b></div>
        <div class="repl-metric"><span>폐수/배출량</span><b id="wasteOut">—</b></div>
        <div class="repl-metric"><span>순수 보충량</span><b id="pureOut">—</b></div>
        <div class="repl-metric"><span>주약품 보충량</span><b id="chemOut">—</b></div>
        <div class="repl-metric"><span>배출 수위</span><b id="drainHeightOut">—</b></div>
        <div class="repl-metric"><span>최종 탱크 용량</span><b id="finalVolumeOut">—</b></div>
        <div class="repl-metric hidden" id="companionMetric"><span>동반 원액 보충</span><b id="companionOut">—</b></div>
        <div class="repl-metric hidden" id="packageMetric"><span>필요 포장 수</span><b id="packageOut">—</b></div>
      </div>
      <p id="replenishmentNote" class="result-note">탱크 용량, 현재농도, 목표농도를 입력해 주세요.</p>
    </div>
    <div class="action-row"><button class="soft-btn" type="button" id="resetReplenishmentBtn">보충량 입력값 초기화</button></div>
  </div>
</section>
<section class="page hidden" id="page-settings">
  <div class="panel">
    <h3>전류 밀도 프리셋</h3>
    <div class="row-3">
      <div class="field"><label>항목명</label><input id="presetName" type="text" placeholder="예: 은도금 일반"></div>
      <div class="field"><label>전류밀도 <small>(A/dm²)</small></label><input id="presetValue" type="number" step="any" placeholder="0.5"></div>
      <div class="field"><label>저장</label><button class="soft-btn" type="button" id="savePresetBtn" style="width:100%">전류밀도 저장</button></div>
    </div>
    <div class="preset-items" id="presetList"></div>
  <div class="settings-block settings-section">
    <h3>기본 표면적 프리셋</h3>
    <div class="row-2">
      <div class="field"><label>형상</label><select id="surfacePresetShape"><option value="cylinder">원통 측면적</option><option value="circle">원 면적</option><option value="box">직육면체 표면적</option></select></div>
      <div class="field"><label>저장 이름</label><input id="surfacePresetName" type="text" placeholder="예: 100파이"></div>
    </div>
    <div class="area-save-row" id="surfacePresetRow" data-shape="cylinder">
      <div class="shape-inputs" id="surfacePresetDims"></div>
      <div class="field area-save-field">
        <label for="saveSurfacePresetBtn">저장</label>
        <button id="saveSurfacePresetBtn" type="button" class="soft-btn">기본 표면적 저장</button>
      </div>
    </div>
    <div class="action-row area-edit-actions"><button id="cancelSurfaceEditBtn" type="button" class="soft-btn hidden">수정 취소</button></div>
    <div class="preset-items" id="surfacePresetList"></div>
  </div>
  </div>
</section>
</div>
<script>
'use strict';
const SHAPES = {

function computeReplenishment(raw){
 const V=raw.mode==='size'?raw.width*raw.depth*raw.height/1e6:raw.volume;
 const invalid=reason=>({error:reason});
 if(!(V>0))return invalid('탱크 용량을 0보다 크게 입력해 주세요.');
 if(!(raw.current>0)||!(raw.target>0))return invalid('현재농도와 목표농도를 0보다 크게 입력해 주세요.');
 if(raw.current<0||raw.target<0)return invalid('농도는 음수가 될 수 없습니다.');
 let waste=0,water=0,chemL=0,chemKg=0,compL=0,compKg=0,packages=0,finalV=V,description='';
 if(raw.current>raw.target){
   waste=V*(1-raw.target/raw.current);water=waste;description='희석 계산: 배출 후 순수를 보충합니다.';
   if(raw.companionEnabled){
    if(!(raw.compSG>0&&raw.compPct>0&&raw.compTarget>=0&&raw.compCurrent>=0))return invalid('동반약품 현재/목표 농도, 원액 wt%, 비중을 확인해 주세요.');
    const needed=raw.compTarget*V-raw.compCurrent*(V-waste);
    if(needed<-1e-8)return invalid('희석 후에도 동반약품 농도가 목표보다 높아, 보충만으로 동시 목표를 유지할 수 없습니다.');
    const stock=raw.compSG*1000*raw.compPct/100;
    compL=Math.max(0,needed)/stock;compKg=compL*raw.compSG;
    if(compL>waste+1e-8)return invalid('필요한 동반약품 원액 부피가 배출량을 초과합니다. 목표 농도 또는 공정을 재검토해 주세요.');
    water=Math.max(0,waste-compL);
    if(raw.packageSize>0)packages=raw.packageUnit==='kg'?compKg/raw.packageSize:compL/raw.packageSize;
    description='희석 및 동반약품 보충: 동반 원액 부피만큼 순수 보충량에서 차감합니다.';
   }
 }else if(raw.current<raw.target){
   if(raw.chemType==='solid'){
    const purity=raw.purity===null?100:raw.purity;
    if(!(purity>0&&purity<=100))return invalid('고형약품 순도는 0~100% 범위에서 입력해 주세요.');
    chemKg=(raw.target-raw.current)*V/1000/(purity/100);
    description='고형 약품 보충: 고형 약품 순도를 반영한 투입 중량입니다.';
   }else{
    const stock=raw.inputMode==='gpl'?raw.stockGpl:raw.sg*1000*(raw.pct/100);
    if(!(stock>raw.target)||(raw.inputMode!=='gpl'&&!(raw.sg>0)))return invalid('액상 원액의 유효 농도는 목표 농도보다 높아야 하며, wt% 방식은 비중도 필요합니다.');
    const divisor=raw.volumeMode==='grow'?stock-raw.target:stock-raw.current;
    chemL=V*(raw.target-raw.current)/divisor;chemKg=raw.sg>0?chemL*raw.sg:0;
    if(raw.volumeMode==='grow')finalV=V+chemL;
    else waste=chemL;
    description=raw.volumeMode==='grow'?'액상 약품 보충: 탱크 용량 증가를 반영했습니다.':'액상 약품 보충: 같은 부피를 먼저 배출하는 일정 용량 방식입니다.';
   }
 }else description='현재 농도와 목표 농도가 같습니다. 보충량은 0입니다.';
 const drainMm=raw.width>0&&raw.depth>0?waste*1e6/(raw.width*raw.depth):null;
 return {V,waste,water,chemL,chemKg,compL,compKg,packages,finalV,drainMm,description};
}
function replenishmentInput(){
 return {mode:radio('tankMode'),volume:inputNum('tankVolume'),width:inputNum('tankWidth'),depth:inputNum('tankDepth'),height:inputNum('tankHeight'),current:inputNum('currentConc'),target:inputNum('targetConc'),chemType:radio('chemType'),purity:$('solidPurity').value===''?null:inputNum('solidPurity'),inputMode:radio('chemInputMode'),pct:inputNum('chemPct'),stockGpl:inputNum('stockGpl'),sg:inputNum('chemSG'),volumeMode:radio('volumeMode'),inputUnit:$('liquidInputUnit').value,inputAmount:inputNum('chemInputAmount'),companionEnabled:$('companionEnable').checked,compCurrent:inputNum('companionCurrent'),compTarget:inputNum('companionTarget'),compPct:inputNum('companionPct'),compSG:inputNum('companionSG'),packageSize:inputNum('packageSize'),packageUnit:$('packageUnit').value};
}
function renderReplenishment(){
 toggleReplenishmentFields();const raw=replenishmentInput();const res=computeReplenishment(raw);
 $('companionMetric').classList.toggle('hidden',!raw.companionEnabled);$('packageMetric').classList.toggle('hidden',!raw.companionEnabled);
 const ids=['volumeResult','wasteOut','pureOut','chemOut','drainHeightOut','finalVolumeOut','companionOut','packageOut'];
 if(res.error){ids.forEach(id=>textOut(id,'—'));$('replenishmentNote').textContent=res.error;$('replenishmentNote').classList.add('repl-error');return;}
 $('replenishmentNote').classList.remove('repl-error');
 textOut('volumeResult',fmt(res.V,2)+' L');textOut('wasteOut',fmt(res.waste,2)+' L');textOut('pureOut',fmt(res.water,2)+' L');
 textOut('chemOut',res.chemL>0?fmt(res.chemL,2)+' L'+(res.chemKg>0?' / '+fmt(res.chemKg)+' kg':''):(res.chemKg>0?fmt(res.chemKg)+' kg':'0.000 kg'));
 textOut('drainHeightOut',res.drainMm===null?'바닥 치수 입력 시 표시':fmt(res.drainMm)+' mm');
 textOut('finalVolumeOut',fmt(res.finalV,2)+' L');textOut('companionOut',fmt(res.compL,2)+' L / '+fmt(res.compKg)+' kg');textOut('packageOut',raw.packageSize>0?fmt(res.packages,2)+' 포장':'포장 크기 입력 시 표시');
 const conversion=raw.chemType==='liquid'&&raw.inputAmount>0&&raw.sg>0?` 입고량 ${fmt(raw.inputAmount,2)} ${raw.inputUnit} = ${fmt(raw.inputUnit==='kg'?raw.inputAmount/raw.sg:raw.inputAmount*raw.sg,2)} ${raw.inputUnit==='kg'?'L':'kg'}.`:'';
 $('replenishmentNote').textContent=res.description+conversion;
}
function bindReplenishment(){
 const page=$('page-replenishment');page.addEventListener('input',renderReplenishment);page.addEventListener('change',renderReplenishment);
 $('resetReplenishmentBtn').addEventListener('click',()=>{page.querySelectorAll('input[type="number"]').forEach(i=>i.value='');page.querySelectorAll('input[type="checkbox"]').forEach(i=>i.checked=false);page.querySelectorAll('input[type="radio"]').forEach(i=>i.checked=i.defaultChecked);renderReplenishment();});
 renderReplenishment();
}
function initPwa(){
 if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js?v=143',{updateViaCache:'none'}).catch(()=>{});
}
function syncStickyOffset(){
 const bar=document.querySelector('.topbar');
 if(bar)document.documentElement.style.setProperty('--topbar-h', `${Math.ceil(bar.offsetHeight)}px`);
}
window.addEventListener('resize',syncStickyOffset,{passive:true});
window.addEventListener('load',syncStickyOffset,{once:true});
syncStickyOffset();
renderTabs();bindSurface();bindDensitySettings();bindAreaSettings();bindReplenishment();initPwa();

</script>
</body>
</html>
